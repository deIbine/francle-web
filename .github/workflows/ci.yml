# Vérifie chaque PR, puis met le site en ligne sur GitHub Pages à chaque fusion dans main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Droits minimum : lire le code, et publier sur Pages (le jeton « id-token » prouve à Pages qui publie).
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; une nouvelle fusion annule la publication en attente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # Le serveur (serveur/, depuis web.9.2.1) : ses tests tournent déjà dans « verifier » (npm test lance les deux
  # projets) ; ici, on vérifie que wrangler sait construire le Worker, sans rien publier (--dry-run).
  serveur:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serveur
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: serveur/package-lock.json
      - run: npm ci
      - run: npm run construire

  # À chaque fusion dans main : la base d'abord (les migrations pas encore appliquées, qui ne font qu'ajouter), puis le
  # Worker. Les secrets ne sont lus qu'ici : une PR, même venue d'ailleurs, n'y a jamais accès.
  publier-serveur:
    if: github.event_name == 'push'
    needs: [verifier, serveur]
    runs-on: ubuntu-latest
    # une publication du serveur ne s'interrompt pas au milieu (une migration à moitié faite) : elles passent l'une
    # après l'autre, sans s'annuler
    concurrency:
      group: publier-serveur
      cancel-in-progress: false
    defaults:
      run:
        working-directory: serveur
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: serveur/package-lock.json
      - run: npm ci
      - run: npm run migrer
      - run: npm run publier

  publier:
    if: github.event_name == 'push'
    needs: verifier
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v4
